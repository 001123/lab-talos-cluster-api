apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: sync-workloads
  namespace: flux-system
spec:
  interval: 2m
  path: ./gitops/workloads/dev-cluster
  prune: true
  sourceRef:
    kind: GitRepository
    name: talos-cluster-api-repo
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  timeout: 5m
