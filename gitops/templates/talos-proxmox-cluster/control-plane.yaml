apiVersion: controlplane.cluster.x-k8s.io/v1alpha3
kind: TalosControlPlane
metadata:
  name: talos-cluster-template-control-plane
  namespace: default
spec:
  version: v1.36.3
  replicas: 1
  infrastructureTemplate:
    apiVersion: infrastructure.cluster.x-k8s.io/v1alpha2
    kind: ProxmoxMachineTemplate
    name: talos-cluster-template-cp-machine
  controlPlaneConfig:
    controlplane:
      generateType: controlplane
      talosVersion: v1.13.9
---
apiVersion: infrastructure.cluster.x-k8s.io/v1alpha2
kind: ProxmoxMachineTemplate
metadata:
  name: talos-cluster-template-cp-machine
  namespace: default
spec:
  template:
    spec:
      checks:
        skipCloudInitStatus: true
        skipQemuGuestAgent: true
      templateSelector:
        matchTags:
          - talos
      numSockets: 1
      numCores: 2
      memoryMiB: 4096
      disks:
        bootVolume:
          disk: scsi0
          sizeGb: 24
      network:
        networkDevices:
          - bridge: vmbr0
            model: virtio


