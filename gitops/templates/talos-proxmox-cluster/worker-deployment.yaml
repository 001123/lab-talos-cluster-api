apiVersion: cluster.x-k8s.io/v1beta1
kind: MachineDeployment
metadata:
  name: talos-cluster-template-workers
  namespace: default
spec:
  clusterName: talos-cluster-template
  replicas: 2
  selector:
    matchLabels: {}
  template:
    spec:
      clusterName: talos-cluster-template
      version: v1.36.3
      bootstrap:
        configRef:
          apiVersion: bootstrap.cluster.x-k8s.io/v1alpha3
          kind: TalosConfigTemplate
          name: talos-cluster-template-worker-config
      infrastructureRef:
        apiVersion: infrastructure.cluster.x-k8s.io/v1alpha2
        kind: ProxmoxMachineTemplate
        name: talos-cluster-template-worker-machine
---
apiVersion: bootstrap.cluster.x-k8s.io/v1alpha3
kind: TalosConfigTemplate
metadata:
  name: talos-cluster-template-worker-config
  namespace: default
spec:
  template:
    spec:
      generateType: worker
      talosVersion: v1.13.9
---
apiVersion: infrastructure.cluster.x-k8s.io/v1alpha2
kind: ProxmoxMachineTemplate
metadata:
  name: talos-cluster-template-worker-machine
  namespace: default
spec:
  template:
    spec:
      checks:
        skipCloudInitStatus: true
      templateSelector:
        matchTags:
          - talos
      numSockets: 1
      numCores: 2
      memoryMiB: 4096
      disks:
        bootVolume:
          disk: scsi0
          sizeGb: 40
      network:
        networkDevices:
          - bridge: vmbr0
            model: virtio


